# Add this location to your existing HTTPS server block.
# Nginx terminates public TLS; TunnelX's port 7100 uses tls.enable: false.
# If TunnelX itself uses TLS, configure an HTTPS upstream with certificate
# verification instead of using this plain-HTTP upstream.
# Reference: https://nginx.org/en/docs/http/websocket.html
location = /proxy {
    proxy_pass http://127.0.0.1:7100/proxy;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Sec-WebSocket-Protocol $http_sec_websocket_protocol;
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
}
