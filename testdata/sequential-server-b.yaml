server:
    bind_addr: 127.0.0.1
    bind_port: 7301
auth:
    method: token
    token: sequential-token
tls:
    enable: false
log:
    level: info
    file: testdata/sequential-server-b.log
dashboard:
    enable: true
    port: 7301
    password_file: testdata/sequential-server-b.password
port_pool:
    start: 15101
    end: 15200
heartbeat_timeout: 90
