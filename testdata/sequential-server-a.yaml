server:
    bind_addr: 127.0.0.1
    bind_port: 7300
auth:
    method: token
    token: sequential-token
tls:
    enable: false
log:
    level: info
    file: testdata/sequential-server-a.log
dashboard:
    enable: true
    port: 7300
    password_file: testdata/sequential-server-a.password
port_pool:
    start: 15001
    end: 15100
heartbeat_timeout: 90
